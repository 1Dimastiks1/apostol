<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0f0706">
  <title>Немає з’єднання · Петропавлівський храм</title>
  <style>
    *{box-sizing:border-box;margin:0}
    body{min-height:100svh;display:grid;place-items:center;padding:24px;text-align:center;color:#f6efe3;background:#0f0706 radial-gradient(ellipse at 50% 30%,rgba(90,20,24,.55),transparent 62%);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    main{max-width:420px}
    .mark{width:64px;height:64px;margin:0 auto 24px;border:1px solid rgba(198,160,82,.5);border-radius:50%;display:grid;place-items:center;color:#e8cf8d}
    h1{font-family:Georgia,serif;font-weight:500;font-size:1.9rem}
    p{margin-top:14px;line-height:1.7;color:rgba(246,239,227,.7)}
    button{margin-top:28px;padding:13px 26px;border:0;border-radius:999px;font-weight:700;font-size:.95rem;color:#1b0607;background:linear-gradient(#f3dfa0,#a8853c)}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"><svg width="18" height="24" viewBox="0 0 18 24" fill="none"><path d="M9 0v24M3 6h12M5 17l8-3" stroke="currentColor" stroke-width="1.6"/></svg></div>
    <h1>Немає з’єднання</h1>
    <p>Схоже, інтернет зник. Перевірте мережу й спробуйте ще раз. Щойно зв’язок з’явиться, сайт парафії відкриється.</p>
    <p>Телефон храму: <a style="color:#e8cf8d" href="tel:+380971312886">+38 (097) 131-28-86</a></p>
    <button type="button" onclick="location.reload()">Спробувати ще раз</button>
  </main>
</body>
</html>
